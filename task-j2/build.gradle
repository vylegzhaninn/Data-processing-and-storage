plugins {
    id 'java'
    id 'application'
}

group = 'io.github.vylegzhaninn'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = project.hasProperty('mainClass') ? project.property('mainClass') : 'synclist.Main'
}

// Интерактивный режим: программа читает stdin пользователя.
tasks.named('run', JavaExec) {
    standardInput = System.in
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
